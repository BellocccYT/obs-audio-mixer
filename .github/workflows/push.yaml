name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    # Jeder Push auf einen Branch baut und prüft das Format. Ein Release mit den Paketen und dem passenden
    # Abschnitt aus CHANGELOG.md entsteht, sobald eine neue Version aus buildspec.json auf dem Standard-Branch
    # landet (z. B. durch das Mergen eines Pull Requests) oder ein Tag wie 0.1.0 gepusht wird.
    branches:
      - '**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Release Data 📝
        uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: |
            CHANGELOG.md
            buildspec.json
          sparse-checkout-cone-mode: false

      - name: Check Release Tag ☑️
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          # Tag: Version aus dem Tag. Push auf den Standard-Branch: Version aus buildspec.json, aber nur,
          # solange es dafür noch kein Release-Tag gibt.
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(jq -r '.version' source/buildspec.json)"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${version}" > /dev/null 2>&1; then
              echo "Version ${version} ist schon veröffentlicht, kein neues Release"
              version=''
            fi
          fi

          case "${version}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${version}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${version}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Generate Release Notes 📝
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Release Notes 📝
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # Abschnitt „## <Version>“ aus CHANGELOG.md, danach die Prüfsummen
          notes=${{ github.workspace }}/RELEASE.md
          awk -v version="${{ steps.check.outputs.version }}" '
            /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' source/CHANGELOG.md > "${notes}" || true
          echo "" >> "${notes}"
          cat ${{ github.workspace }}/CHECKSUMS.txt >> "${notes}"

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/RELEASE.md
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
